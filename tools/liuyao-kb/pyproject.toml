[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liuyao-kb"
version = "0.1.0"
description = "Incremental importer and evidence-pack query tool for the Liuyao learning knowledge base"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "neo4j>=6.0,<7.0",
    "certifi>=2024.2.2",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "typer>=0.12,<1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
liuyao-kb = "liuyao_kb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liuyao_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:liuyao_kb.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["liuyao_kb"]
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
