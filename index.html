  function recordMarkdownApiPath(record){
    const date=String(record?.date||'');
    const id=String(record?.id||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!/^[A-Za-z0-9_-]{1,100}$/.test(id)){
      throw new Error('这条卦例缺少合法日期或记录 ID，无法生成独立 MD 文件');
    }
    return '/record-markdown/'+date+'/'+encodeURIComponent(id);
  }
  function recordMarkdownFilePath(record){
    const date=String(record.date),id=String(record.id);
    return 'daily-records/'+date.slice(0,4)+'/'+date.slice(5,7)+'/markdown/'+date+'--'+id+'.md';
  }
  function formatRecordAsMarkdown(record){
    const text=formatRecordForAI(record);
    const marker='【原始记录 JSON｜schemaVersion 16，含 analysisSnapshot v5（含人工伏藏标记）】';
    const markerIndex=text.lastIndexOf(marker);
    if(markerIndex<0) throw new Error('卦盘文字中缺少原始 JSON，无法生成完整 MD 文件');
    const narrative=text.slice(0,markerIndex).trim()
      .replace(/^【六爻卦盘资料｜供其他 AI 阅读】$/m,'# 六爻卦盘资料')
      .replace(/^【([^】]+)】/gm,'## $1');
    const rawJson=text.slice(markerIndex+marker.length).trim();
    const recordPath='daily-records/'+String(record.date).slice(0,4)+'/'+String(record.date).slice(5,7)+'/'+String(record.date)+'.json';
    const fence='\u0060\u0060\u0060';
    return [
      narrative,
      '',
      '> 本文件由六爻排卦页面中的 JavaScript 根据保存的 JSON 和确定性排盘规则生成；未调用 AI 模型，不包含 AI 解卦意见。',
      '> 对应原始数据：'+recordPath,
      '> 本文件路径：'+recordMarkdownFilePath(record),
      '',
      '## 原始记录 JSON',
      '',
      fence+'json',
      rawJson,
      fence,
      ''
    ].join('\n');
  }
  async function saveRecordMarkdown(record){
    if(!githubAuthenticated&&!await refreshGitHubAuth()) throw new Error('请先连接 GitHub');
    const path=recordMarkdownApiPath(record);
    const markdown=formatRecordAsMarkdown(record);
    const existing=await githubRequest(path,{method:'GET'});
    if(existing.markdown===markdown&&existing.sha) return {saved:true,unchanged:true,sha:existing.sha};
    return githubRequest(path,{method:'PUT',body:JSON.stringify({markdown,sha:existing.sha||null})});
  }
  async function deleteRecordMarkdown(record){
    const path=recordMarkdownApiPath(record);
    const existing=await githubRequest(path,{method:'GET'});
    if(!existing.sha) return {deleted:true,missing:true};
    return githubRequest(path,{method:'DELETE',body:JSON.stringify({sha:existing.sha})});
  }
  async function copyRecordMarkdown(record){
    const markdown=formatRecordAsMarkdown(record);
    let saved=false,saveError=null;
    if(githubAuthenticated||await refreshGitHubAuth()){
      try{await saveRecordMarkdown(record);saved=true;}
      catch(error){saveError=error;}
    }
    let copied=false;
    try{
      await navigator.clipboard.writeText(markdown);
      copied=true;
    }catch(error){
      const field=document.createElement('textarea');
      field.value=markdown;field.setAttribute('readonly','');
      field.style.position='fixed';field.style.opacity='0';field.style.pointerEvents='none';
      document.body.appendChild(field);field.select();
      copied=document.execCommand('copy');field.remove();
    }
    if(!copied){showToast('复制 MD 失败，请检查浏览器剪贴板权限');return;}
    if(saved) showToast('MD 文件已保存并复制');
    else if(saveError){setGitHubStatus('MD 未同步：'+saveError.message);showToast('MD 已复制，但保存失败：'+saveError.message);}
    else showToast('MD 已复制；连接 GitHub 后才能保存文件');
  }

  function updateImportSelectionUI(){

      all.checked=eligible.length>0&&selected===eligible.length;

    }

  function renderImportCandidates(){
    importList.replaceChildren();
    const eligible=importCandidates.filter(item=>!item.duplicate).length;
    const duplicates=importCandidates.length-eligible;
    document.getElementById('import-summary').textContent=
      '文件中找到 '+importCandidates.length+' 条有效卦例；其中 '+duplicates+' 条已存在，将跳过。勾选要导入的记录。导入内容仅加入当前浏览器记录列表，不会覆盖 GitHub 原文件。';
    importCandidates.forEach((candidate,index)=>{
      const item=document.createElement('div');item.className='import-item';
      const label=document.createElement('label');label.className='import-select';
      const checkbox=document.createElement('input');checkbox.type='checkbox';
      checkbox.checked=!!candidate.selected;checkbox.disabled=!!candidate.duplicate;
      checkbox.addEventListener('change',()=>{
        candidate.selected=checkbox.checked;
        updateImportSelectionUI();
      });
      label.append(checkbox);
      const main=document.createElement('div');main.className='import-item-main';
      const title=document.createElement('div');title.className='import-item-title';
      title.textContent=(candidate.record.date||'未注明日期')+'　'+recordHexagramName(candidate.record);
      const sub=document.createElement('div');sub.className='import-item-sub';
      sub.textContent=[
        candidate.record.question?.categoryLabel||'',
        candidate.record.question?.text||'',
        candidate.record.savedAt||''
      ].filter(Boolean).join(' · ')||recordThrowText(candidate.record);
      main.append(title,sub);
      if(candidate.duplicate){
        const status=document.createElement('div');status.className='import-item-status';status.textContent='这条记录已存在，导入时会跳过';
        main.append(status);
      }
      item.append(label,main);importList.append(item);
    });
    updateImportSelectionUI();
  }

      const seenInFile=new Set();
      importCandidates=valid.map((record,index)=>{
        const normalized={...record,id:record.id||('import-'+Date.now()+'-'+index)};
        const id=String(normalized.id);
        const duplicate=existingIds.has(id)||seenInFile.has(id);
        seenInFile.add(id);
        return {record:normalized,duplicate,selected:!duplicate};
      });
      renderImportCandidates();
      importDialog.showModal();
    }catch(error){
      showToast('JSON 文件无法识别，请选择本工具导出的卦例文件');
    }finally{
      document.getElementById('import-records-file').value='';
    }
  }
  function confirmImportSelected(){
    const chosen=importCandidates.filter(candidate=>candidate.selected&&!candidate.duplicate).map(candidate=>candidate.record);
    if(!chosen.length){showToast('请先勾选要导入的卦例');return;}
    const existing=readRecords();
    const known=new Set(existing.map(record=>String(record.id||'')));
    const normalized=chosen.filter(record=>!known.has(String(record.id)));
    if(!normalized.length){showToast('所选卦例都已经存在');return;}
    if(writeRecords([...normalized,...existing])){
      selectedRecordKeys.clear();
      importDialog.close();
      renderRecords();
      showToast('已导入 '+normalized.length+' 条卦例');
      importCandidates=[];
    }
  }
  document.getElementById('save-record').addEventListener('click',saveCurrentRecord);
  function resetToNewEntry(){
    state=Array.from({length:6},()=>({flowers:null,branch:null,relation:null,hiddenRelation:null,shen:null,changeBranch:null,changeRelation:null,effect:''}));
    calendarAssignments={yearRelation:null,monthRelation:null,dayRelation:null,dayGod:null,xunkong1:null,xunkong2:null};
    selected=null;editingRecordId=null;forceNewRecord=true;
    setCaseEditor(null);setQuestionCategory('daily');questionTextEl.value='';memoTextarea.value='';caseConclusionTextarea.value='';
    renderManualPillarInputs();applyPillarContext();
    updateSelectedTiles();renderCalendarDropSlots();
    state.forEach((_,index)=>renderRow(index));refreshBranchStatusTokens();renderTrigramNames();
    markEntryClean();showToast('已开启新卦；之前的记录保持不变');
  }
  async function clearCurrentEntry(){
    if(isEntryDirty()){
      const decision=await askHowToHandleUnsavedChanges();
      if(decision==='cancel') return;
      if(decision==='save'&&!await saveCurrentRecord()) return;
      // Discard means the edited form is abandoned; the saved/imported source record is untouched.
    }
    resetToNewEntry();
  }
  document.getElementById('clear-current-entry').addEventListener('click',clearCurrentEntry);
  document.getElementById('github-login').addEventListener('click',async()=>{
    if(githubAuthenticated){try{await githubRequest('/auth/logout',{method:'POST',body:'{}'});githubAuthenticated=false;githubShaByDate.clear();setGitHubStatus('GitHub 已断开');document.getElementById('github-login').textContent='连接 GitHub';}catch(error){showToast('断开失败：'+error.message);}}
    else window.location.href='/api/auth/login';
  });
  document.getElementById('open-records').addEventListener('click',async()=>{
    renderRecords();
    recordsDialog.showModal();
    try{await loadAllRecordsFromGitHub();}
    catch(error){
      if(error.status===401){githubAuthenticated=false;setGitHubStatus('GitHub 授权已失效，请重新连接');}
      else setGitHubStatus('GitHub 同步失败：'+error.message);
      showToast('读取 GitHub 卦例失败：'+error.message);
    }
  });
  document.getElementById('close-records').addEventListener('click',()=>recordsDialog.close());
  document.getElementById('export-records').addEventListener('click',()=>exportRecords(getSelectedRecords()));
  document.getElementById('select-all-records').addEventListener('change',event=>{
    const records=readRecords();
    if(event.target.checked) records.forEach(record=>selectedRecordKeys.add(recordSelectionKey(record)));
    else selectedRecordKeys.clear();
    renderRecords();
  });
  document.getElementById('import-records').addEventListener('click',()=>document.getElementById('import-records-file').click());
  document.getElementById('import-records-file').addEventListener('change',event=>importRecordsFile(event.target.files?.[0]));
  document.getElementById('select-all-import').addEventListener('change',event=>{
    importCandidates.forEach(candidate=>{if(!candidate.duplicate) candidate.selected=event.target.checked;});
    renderImportCandidates();
  });
  document.getElementById('confirm-import').addEventListener('click',confirmImportSelected);
  document.getElementById('close-import').addEventListener('click',()=>importDialog.close());
  document.getElementById('cancel-import').addEventListener('click',()=>importDialog.close());
  recordsDialog.addEventListener('click',event=>{if(event.target===recordsDialog)recordsDialog.close();});
  renderRecords();
  markEntryClean();
  refreshGitHubAuth().then(ok=>{if(ok)loadDayFromGitHub(selectedDateKey);});

})();
</script>
</body>
</html>
