<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六爻排卦与每日记录 v98</title>
<style>
  :root {
    --paper:#f7f3e9; --paper-2:#efe7d5; --ink:#282b25; --muted:#77786b;
    --line:#ded5c2; --card:#fffdf7; --jade:#496d5a; --jade-soft:#e8f0e8;
    --gold:#b58a42; --gold-soft:#f8edd3; --red:#9f4e38; --red-soft:#f8e8df;
    --shadow:0 8px 24px rgba(61,48,28,.06); --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:linear-gradient(180deg,#eee7d8 0,var(--paper) 300px,var(--paper) 100%);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  button,input{font:inherit}
  button{cursor:pointer}
  .shell{max-width:1420px;margin:auto;padding:28px 22px 56px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  .brand{display:flex;gap:13px;align-items:center}
  .brand-mark{width:46px;height:46px;border:1px solid #c4b58e;border-radius:50%;display:grid;place-items:center;color:var(--jade);background:#fbf6e9;font-size:26px;box-shadow:inset 0 0 0 4px #f1e8d4}
  .eyebrow{font-size:11px;letter-spacing:.16em;color:var(--jade);font-weight:800;margin-bottom:2px}
  h1{font-size:clamp(23px,3vw,31px);line-height:1.25;margin:0;font-weight:750;letter-spacing:.02em}
  .subtitle{margin:6px 0 0;color:var(--muted);font-size:13px}
  .prototype-tag{border:1px solid #d5c9ae;border-radius:999px;padding:7px 12px;color:#7c6640;background:#f8f0dc;font-size:12px;white-space:nowrap}
  .card{background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .section-title{font-size:16px;font-weight:800;margin:0;display:flex;gap:9px;align-items:center}
  .num{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade);font-size:12px}
  .section-note{font-size:12px;color:var(--muted);margin:4px 0 0}
  .date-card{padding:11px 17px;margin-bottom:12px}
  .date-layout{display:flex;flex-direction:column;gap:4px;align-items:stretch}
  .calendar-topline{display:flex;justify-content:flex-end;align-items:center;min-height:16px}
  .today-stamp{font-size:11px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .calendar-pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:center}
  .cal-cell{min-height:55px;display:flex;align-items:center;justify-content:center;gap:9px;padding:5px 7px;background:transparent;border:0;border-radius:0}
  .cal-cell .label{writing-mode:vertical-rl;text-orientation:upright;display:block;color:var(--muted);font-size:13px;font-weight:750;letter-spacing:0;line-height:1.05;margin:0}
  .cal-cell b{font-size:22px;letter-spacing:.12em;color:var(--ink);line-height:1.1;font-weight:900}
  .cal-cell small{display:none}
  .calendar-value{display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
  .calendar-char.element-water{color:#2677b8}
  .calendar-char.element-wood{color:#32844b}
  .calendar-char.element-earth{color:#89613f}
  .calendar-char.element-fire{color:#c44738}
  .calendar-char.element-metal{color:#b98519}
  /* v49: monthly 旺相 marker. Fill = 旺 element; ring = 相 element.
     Compact 36px circle with a 3px ring; no glow/shadow and no pillar-width change. */
  .calendar-char.month-wangxiang{
    width:36px;height:36px;min-width:36px;max-width:36px;flex:0 0 36px;
    display:inline-flex;align-items:center;justify-content:center;
    margin:0;padding:0;box-sizing:border-box;
    border:3px solid var(--xiang-color);border-radius:50%;
    background:var(--wang-bg);color:var(--branch-color) !important;
    font-size:19px;line-height:1;font-weight:900;letter-spacing:0;
    box-shadow:none;vertical-align:middle;
  }
  .palette-card{padding:12px 14px;margin-bottom:10px}
  .palette-grid{display:grid;grid-template-columns:minmax(250px,1.35fr) minmax(220px,1fr);gap:16px;align-items:center}
  .palette-group+.palette-group{border-left:1px solid var(--line);padding-left:14px}
  .palette-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin:0 0 9px}
  .palette-title .hint{font-size:11px;font-weight:500;color:var(--muted)}
  .branch-groups{display:grid;grid-template-columns:auto auto;gap:12px;align-items:center}
  .branch-sub{font-size:11px;color:var(--muted);margin-bottom:6px}
  .tiles{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .tile{user-select:none;touch-action:none;border:1px solid #dcd5c5;background:#fffdf7;border-radius:7px;min-width:28px;width:28px;height:30px;padding:3px 1px;text-align:center;color:var(--ink);font-size:13px;font-weight:750;cursor:grab;box-shadow:none;transition:transform .2s cubic-bezier(.2,.75,.25,1),border-color .2s ease,background .2s ease,box-shadow .2s ease}
  .tile:hover{border-color:#8da794;transform:translateY(-4px) scale(1.12);z-index:4;cursor:grab;box-shadow:0 4px 10px rgba(61,48,28,.16)}
  .tile:active{cursor:grabbing}
  .tile.selected{outline:2px solid var(--gold);background:var(--gold-soft);border-color:var(--gold);position:relative;z-index:6;transform:translateY(-6px) scale(1.18);box-shadow:0 6px 14px rgba(61,48,28,.24)}
  .branch-pair .tile.selected{transform:translateY(-6px) scale(1.18);z-index:7}
  .tile.selected:hover,.branch-pair .tile.selected:hover{transform:translateY(-6px) scale(1.18);z-index:8;box-shadow:0 6px 14px rgba(61,48,28,.24)}
  .tile.yang{color:#8a6032;background:#fcf5e5}
  .tile.yin{color:#526c83;background:#f0f5f7}
  /* Five-element colors for the earthly branches */
  .tile.element-water{color:#2677b8;background:#eaf3fb;border-color:#b9d5ea}
  .tile.element-wood{color:#32844b;background:#edf6ed;border-color:#bfd9c2}
  .tile.element-earth{color:#89613f;background:#f5eee5;border-color:#d9c6ae}
  .tile.element-fire{color:#c44738;background:#fff0ed;border-color:#efc2b9}
  .tile.element-metal{color:#b98519;background:#fcf4df;border-color:#e5d19b}
  .kin-tiles .tile{min-width:44px;width:44px;height:30px;padding:3px 1px}
  .palette-help{display:none}
  .palette-help strong{color:var(--jade)}
  .worksheet{padding:12px 12px 14px}
  .worksheet-subhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;min-height:36px;flex-wrap:wrap}
  .auto-assembly-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:0 0 auto;margin-left:auto}
  .auto-review-report{width:100%;margin:0 0 8px;padding:8px 10px;border:1px solid #e2d3b8;border-radius:8px;background:#fbf6e9;color:#504b3f;font-size:12px;line-height:1.5}
  .auto-review-report[hidden]{display:none!important}
  .auto-review-report strong{display:block;margin-bottom:2px;font-size:12px;font-weight:900}
  .auto-review-summary{color:#686252}
  .auto-review-list{display:grid;gap:2px;margin:5px 0 0;padding-left:18px;max-height:190px;overflow:auto}
  .auto-review-list li{padding-right:3px}
  .auto-review-list li.error{color:#a33e2d}
  .auto-review-list li.missing{color:#90651d}
  .auto-review-list li.note{color:#65685d}
  .drop-slot.auto-check-error{border:1.5px solid #b94d39!important;background:#fff0ec!important;box-shadow:0 0 0 2px rgba(185,77,57,.13)!important}
  .drop-slot.auto-check-missing{border:1.5px dashed #b98519!important;background:#fff8e8!important;box-shadow:0 0 0 2px rgba(185,133,25,.11)!important}
  .hexagram-heading{display:flex;align-items:center;min-height:34px;min-width:56px;gap:6px;flex-wrap:wrap;flex:1 1 auto}
  @media(max-width:560px){.auto-assembly-actions{width:100%;margin-left:0;justify-content:flex-start}.auto-assembly-actions .small-action{padding:5px 8px;font-size:11px}.auto-review-report{font-size:11px}}
  .date-branch-sidecar{white-space:nowrap;}
  .hexagram-name{display:inline-flex;align-items:center;font-size:25px;font-weight:900;line-height:1;letter-spacing:.04em;white-space:nowrap}
  .hexagram-shi-prefix{margin-right:1px}
  .hexagram-meta{font-size:15px;font-weight:900;line-height:1.2;color:#282b25;white-space:nowrap;padding:0;margin-left:5px;min-height:0;display:inline-flex;align-items:center;gap:0}
  .hexagram-meta:empty{display:none}
  .hexagram-meta .relation-shi,.hexagram-meta .relation-ying{font-weight:950}
  .hexagram-meta .relation-word{color:#282b25;font-weight:850}
  .line-result{display:flex;align-items:center;justify-content:center;gap:3px}
  .yao-mark{width:37px;flex:0 0 37px;margin:0}
  .yao-mark.yin{gap:4px}
  .yao-mark.yin .yangbar{width:16px}
  .line-indicators{width:12px;flex:0 0 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:visible}
  .line-indicators span{display:none;position:relative;width:11px;height:11px;flex:0 0 11px;border-radius:50%;background:#aaa69b;box-shadow:0 0 0 1px rgba(40,43,37,.08);}
  .shi-indicator.active,.ying-indicator.active{display:block}
  .line-indicators .shi-indicator.active::after,.line-indicators .ying-indicator.active::after{
    position:absolute;left:50%;top:-11px;transform:translateX(-50%);
    padding:0 2px;border-radius:3px;background:rgba(255,253,247,.96);
    color:#282b25;font-size:9px;line-height:1.05;font-weight:900;white-space:nowrap;
    box-shadow:0 0 1px rgba(40,43,37,.18);
  }
  .line-indicators .shi-indicator.active::after{content:'世';}
  .line-indicators .ying-indicator.active::after{content:'应';}

  .hexagram-name.element-water{color:#2677b8}
  .hexagram-name.element-wood{color:#32844b}
  .hexagram-name.element-earth{color:#89613f}
  .hexagram-name.element-fire{color:#c44738}
  .hexagram-name.element-metal{color:#b98519}
  .hexagram-name .element-water{color:#2677b8}
  .hexagram-name .element-wood{color:#32844b}
  .hexagram-name .element-earth{color:#89613f}
  .hexagram-name .element-fire{color:#c44738}
  .hexagram-name .element-metal{color:#b98519}
  .hexagram-name:empty{visibility:hidden}
  .worksheet-tools{display:flex;gap:7px;flex-wrap:wrap}
  .legend{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;flex-wrap:wrap}
  .legend-item{display:inline-flex;align-items:center;gap:5px}
  .legend-dot{width:8px;height:8px;border-radius:50%;background:var(--jade)}
  .legend-dot.gold{background:var(--gold)}
  .legend-dot.blue{background:#7a97ad}
  .change-column-label{display:none}
  .rows{display:flex;flex-direction:column;gap:7px}
  .trigram-group{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:stretch;min-width:0}
  .trigram-name{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0;color:var(--jade);white-space:nowrap;line-height:1.12}
  .trigram-title{display:none}
  .trigram-image{font-size:23px;font-weight:900;opacity:1;letter-spacing:.02em}
  .trigram-name:not(.ready){visibility:hidden}
  .trigram-name.element-water{color:#2677b8}
  .trigram-name.element-wood{color:#32844b}
  .trigram-name.element-earth{color:#89613f}
  .trigram-name.element-fire{color:#c44738}
  .trigram-name.element-metal{color:#b98519}
  .calendar-value{display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
  .calendar-char.element-water{color:#2677b8}
  .calendar-char.element-wood{color:#32844b}
  .calendar-char.element-earth{color:#89613f}
  .calendar-char.element-fire{color:#c44738}
  .calendar-char.element-metal{color:#b98519}
  .calendar-divider{color:#999687;font-weight:500;padding:0 3px}
  .trigram-group-rows{display:flex;flex-direction:column;gap:7px;min-width:0}
  .line-row{display:grid;width:max-content;max-width:100%;grid-template-columns:116px 52px 52px 46px 52px 29px 46px 6em 88px;gap:6px;align-items:center;border:1px solid #e8e0d1;border-radius:9px;padding:6px 8px;background:#fffefb;transition:border-color .15s,background .15s;overflow-x:auto}
  .line-row:hover{border-color:#c9d6c9}
  .branch-cell-group{display:flex;align-items:center;gap:2px;width:100%;min-width:0;}
  .branch-cell-group>.hidden-relation-cell{flex:0 0 21px;width:21px;min-width:21px;height:31px;min-height:31px;padding:0;font-size:9px;}
  .hidden-relation-cell .drop-token{font-size:9px;}
  .hidden-relation-cell .clear-slot{right:-3px;top:-4px;width:10px;height:10px;font-size:8px;}
  .branch-cell-group>.branch-cell{flex:1 1 0;width:auto;min-width:0;}
  .cell-label{display:none;font-size:10px;color:var(--muted);margin-bottom:3px}
  .flower-options{display:flex;gap:3px;flex-wrap:nowrap;justify-content:flex-start}
  .flower-btn{width:26px;min-width:26px;height:29px;flex:0 0 26px;border:1px solid #e0d8c8;border-radius:6px;padding:3px 0;background:#faf7ef;color:#535349;font-size:14px;line-height:1;font-weight:800;white-space:nowrap}
  .flower-btn:hover{border-color:#b6c6b5}
  .flower-btn.active{background:var(--jade-soft);border-color:#7ca087;color:#315844;box-shadow:inset 0 0 0 1px #7ca087}
  .flower-btn.active.moving-option{background:var(--red-soft);border-color:var(--red);color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}

  /* The six casting controls follow the completed hexagram's 八宫 element. */
  .rows.element-water .flower-btn{background:#eaf3fb;border-color:#b9d5ea;color:#2677b8}
  .rows.element-water .flower-btn:hover{background:#dcecf8;border-color:#2677b8}
  .rows.element-water .flower-btn.active,.rows.element-water .flower-btn.active.moving-option{background:#2677b8;border-color:#1d6299;color:#fffdf7;box-shadow:inset 0 0 0 1px #1d6299}
  .rows.element-wood .flower-btn{background:#edf6ed;border-color:#bfd9c2;color:#32844b}
  .rows.element-wood .flower-btn:hover{background:#deefdf;border-color:#32844b}
  .rows.element-wood .flower-btn.active,.rows.element-wood .flower-btn.active.moving-option{background:#32844b;border-color:#286b3c;color:#fffdf7;box-shadow:inset 0 0 0 1px #286b3c}
  .rows.element-earth .flower-btn{background:#f5eee5;border-color:#d9c6ae;color:#89613f}
  .rows.element-earth .flower-btn:hover{background:#eee0d0;border-color:#89613f}
  .rows.element-earth .flower-btn.active,.rows.element-earth .flower-btn.active.moving-option{background:#89613f;border-color:#704b30;color:#fffdf7;box-shadow:inset 0 0 0 1px #704b30}
  .rows.element-fire .flower-btn{background:#fff0ed;border-color:#efc2b9;color:#c44738}
  .rows.element-fire .flower-btn:hover{background:#ffe2dc;border-color:#c44738}
  .rows.element-fire .flower-btn.active,.rows.element-fire .flower-btn.active.moving-option{background:#c44738;border-color:#9f382e;color:#fffdf7;box-shadow:inset 0 0 0 1px #9f382e}
  .rows.element-metal .flower-btn{background:#fcf4df;border-color:#e5d19b;color:#b98519}
  .rows.element-metal .flower-btn:hover{background:#f7eac5;border-color:#b98519}
  .rows.element-metal .flower-btn.active,.rows.element-metal .flower-btn.active.moving-option{background:#b98519;border-color:#946a12;color:#fffdf7;box-shadow:inset 0 0 0 1px #946a12}

  .line-result{text-align:center}
  .change-cell{display:flex;align-items:center;justify-content:center;min-width:0}
  .change-mark{width:48px;height:15px;position:relative;display:flex;gap:4px;align-items:center;justify-content:center}
  .change-mark .yangbar{height:8px;border-radius:2px;background:#393a32;width:100%;transition:background .12s}
  .change-mark.moving .yangbar{background:var(--red)}
  .change-mark.yin{gap:5px}
  .change-mark.yin .yangbar{width:21px}
  .change-mark.empty{visibility:hidden}
  .yao-mark{width:37px;flex:0 0 37px;height:15px;position:relative;margin:0;display:flex;gap:4px;align-items:center;justify-content:center}
  .yao-mark .yangbar{height:9px;border-radius:2px;background:#393a32;width:100%;transition:background .12s}
  .yao-mark.moving .yangbar{background:var(--red)}
  /* Dark movement: a static line struck by the selected date's day branch. */
  .yao-mark.dark-moving .yangbar{background:#2677b8}
  .change-mark.dark-moving .yangbar{background:#2677b8}
  .yao-mark.yin{gap:4px}
  .yao-mark.yin .yangbar{width:16px}
  .drop-slot{width:100%;min-width:0;min-height:31px;height:31px;border:1px dashed #c9c0ad;border-radius:6px;background:#fbf8f0;display:flex;align-items:center;justify-content:center;padding:1px;gap:0;position:relative;text-align:center;transition:.15s;overflow:visible}
  .drop-slot .slot-label{color:#b6ae9d;font-size:13px;line-height:1}
  .drop-slot.drag-over{background:var(--jade-soft);border:1px solid var(--jade);box-shadow:0 0 0 2px rgba(73,109,90,.12)}
  .drop-slot.filled{border-style:solid;border-color:#c3d1c0;background:#f1f6ee}
  .drop-slot.filled.kin-filled{border-color:#d7c39a;background:#fbf2df}
  .drop-token{font-weight:800;color:var(--jade);font-size:13px;line-height:1}
  .drop-token.element-water{color:#2677b8}
  .drop-token.element-wood{color:#32844b}
  .drop-token.element-earth{color:#89613f}
  .drop-token.element-fire{color:#c44738}
  .drop-token.element-metal{color:#b98519}
  .kin-filled .drop-token{color:#80602b}
  .drop-token small{font-size:10px;font-weight:500;color:var(--muted);display:block;margin-top:3px}
  .clear-slot{position:absolute;right:-4px;top:-5px;z-index:2;border:0;border-radius:50%;width:13px;height:13px;display:grid;place-items:center;background:#f4e7de;color:#9c5b4c;padding:0;font-size:11px;line-height:1;opacity:0;cursor:pointer}
  .drop-slot:hover .clear-slot,.clear-slot:focus{opacity:1}.clear-slot:hover{color:var(--red)}

  /* The row frame ends immediately after the dropdown; the page area to its right stays completely blank. */
  .effect-select{appearance:none;-webkit-appearance:none;display:block;width:6em;min-width:6em;max-width:6em;height:31px;border:1px solid #d8cfbd;border-radius:6px;background-color:#fffdf7;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27 fill=%27none%27 stroke=%27%23282b25%27 stroke-width=%271.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27m2 4 4 4 4-4%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 7px center;background-size:12px 12px;color:var(--ink);padding:2px 26px 2px 7px;font-family:inherit;font-size:13px;font-weight:750;line-height:1.2;letter-spacing:0;box-sizing:border-box;cursor:pointer;}
  .effect-select:focus-visible{outline:2px solid rgba(73,109,90,.3);outline-offset:2px;border-color:var(--jade);}
  .effect-select option{font-family:inherit;font-size:13px;font-weight:750;}
  .change-branch-cell{display:flex;align-items:center;justify-content:center;min-width:0;}
  .line-row.trigram-inactive .change-cell,.line-row.trigram-inactive .change-branch-cell,.line-row.trigram-inactive .change-kin-cell{visibility:hidden;pointer-events:none;}
  .drag-ghost{
    position:fixed !important;z-index:1000;pointer-events:none;opacity:.98;
    transform:translate(-50%,-50%) !important;
    box-shadow:0 6px 18px rgba(40,43,37,.24);
    border-color:var(--gold)!important;background:var(--gold-soft)!important;
    cursor:grabbing;margin:0;
  }
  .drop-slot.drag-over{transform:scale(1.04)}
  /* Compact, unframed 64-hexagram memory aid. */
  .palace-reference-card{margin-top:10px;padding:0;background:transparent;border:0;border-radius:0;box-shadow:none;}
  .palace-reference-head{display:none;}
  .palace-reference-scroll{overflow-x:auto;padding:0 0 4px;scrollbar-width:thin;}
  .palace-reference-grid{display:grid;grid-template-columns:repeat(8,minmax(112px,1fr));gap:7px;min-width:952px;}
  .palace-column{min-width:0;border:0;border-radius:0;background:transparent;overflow:visible;}
  .palace-column-head{display:none;}
  .palace-entries{display:flex;flex-direction:column;gap:3px;}
  .palace-entry{appearance:none;-webkit-appearance:none;width:100%;min-width:0;min-height:28px;display:flex;align-items:center;justify-content:center;padding:3px 1px;border:0;border-radius:5px;background:transparent;text-align:center;white-space:nowrap;color:var(--palace-color);font-family:inherit;font-size:18px;font-weight:900;line-height:1.2;}
  .palace-entry .palace-shi-number{font-size:15px;font-weight:900;line-height:1;margin-right:4px;flex:0 0 auto;color:inherit;opacity:.9;}
  .palace-entry .palace-hexagram{overflow:visible;text-overflow:clip;}
  .palace-entry.current{background:rgba(242,205,120,.32);font-weight:950;}
  .palace-element-water{--palace-color:#2677b8;}
  .palace-element-wood{--palace-color:#32844b;}

  /* v24: vertical year/month/day pillars with six-relation slots and a two-branch xun-kong pair. */
  .date-card{padding:9px 13px 11px;margin-bottom:10px}
  .date-layout{display:flex;flex-direction:column;gap:0;align-items:stretch}
  .calendar-topline{min-height:12px;height:12px;justify-content:flex-start;text-align:left}

  .pillar-group{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;flex:0 0 auto}

  .cal-cell .label{display:none}
  .cal-cell b.calendar-value{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;font-size:24px;line-height:1.28;letter-spacing:0;font-weight:900;white-space:nowrap}
  .calendar-value{display:flex;flex-direction:column;align-items:center;gap:0}
  .calendar-char{display:block;line-height:1.28}
  /* v47 alignment guard */
  .cal-cell b.calendar-value{width:32px;min-width:32px;align-items:center}
  .calendar-char.month-wangxiang{display:inline-flex;vertical-align:middle}
  .calendar-drop-slot{width:44px;min-width:44px;height:30px;min-height:30px;}
  .xunkong-group{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;flex:0 0 auto;}
  .xunkong-caption{font-size:10px;line-height:1;color:var(--muted);font-weight:700;letter-spacing:.04em;visibility:hidden;}
  .xunkong-slots{display:flex;align-items:center;gap:3px;}
  .xunkong-drop-slot{width:28px;min-width:28px;height:30px;min-height:30px;}
  .calendar-drop-slot .drop-token{font-size:13px;}
  @media(max-width:460px){
    .calendar-pillars{gap:12px}
    .cal-cell b.calendar-value{font-size:23px}
    .date-card{padding-left:11px;padding-right:11px}

  /* v25: earthly branches arranged in two aligned rows; six-relations palette moved closer. */
  .palette-grid{

    gap:12px;

    border-top:0;

  /* v39: arrange branch rows in the requested order while keeping 六合 pairs vertically grouped. */
  /* v41: hide redundant day-stem spirit hint and 旬空 caption. */
  /* v42: expanded line-effect choices; legacy '生' selection migrates to '回头克'. */
  .branch-groups{
    display:grid;
    grid-template-columns:repeat(6,minmax(36px,1fr));
    gap:6px;
    align-items:stretch;
    width:max-content;
    max-width:100%;
  }
  .branch-pair{
    min-width:36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:4px 3px;
    border:3px solid var(--pair-color);
    border-radius:10px;
    background:var(--pair-bg);
  }
  .branch-pair.liuhe-earth{--pair-color:#89613f;--pair-bg:#f7f0e8;}
  .branch-pair.liuhe-wood{--pair-color:#32844b;--pair-bg:#eff7ee;}
  .branch-pair.liuhe-fire{--pair-color:#c44738;--pair-bg:#fff1ee;}
  .branch-pair.liuhe-metal{--pair-color:#b98519;--pair-bg:#fcf6e7;}
  .branch-pair.liuhe-water{--pair-color:#2677b8;--pair-bg:#edf5fb;}
  .branch-pair.liuhe-fire-earth{
    --pair-bg:#faf2e9;
    border:3px solid transparent;
    background:linear-gradient(var(--pair-bg),var(--pair-bg)) padding-box,
      linear-gradient(135deg,#c44738 0 50%,#89613f 50% 100%) border-box;
  }
  .branch-pair .tile{width:29px;min-width:29px;height:29px;flex:0 0 29px;margin:0;}
  .branch-pair .tile:hover{transform:translateY(-4px) scale(1.12);filter:brightness(.98);z-index:4;box-shadow:0 4px 10px rgba(61,48,28,.16);}
  .branch-pair .tile.yang,.branch-pair .tile.yin{font-weight:850;}
  @media(max-width:820px){
    .branch-groups{gap:5px;}
    .branch-pair{min-width:34px;padding:3px 2px;}
    .branch-pair .tile{width:27px;min-width:27px;flex-basis:27px;height:28px;}
  }
  @media(max-width:460px){
    .branch-groups{grid-template-columns:repeat(6,minmax(32px,1fr));gap:4px;width:100%;}
    .branch-pair{min-width:0;padding:3px 1px;border-radius:8px;}
    .branch-pair .tile{width:25px;min-width:25px;flex-basis:25px;height:27px;font-size:12px;}
  }

  /* v35: six-god column, date picker and persistent complete-hexagram records. */

  @media(max-width:600px){.mansions-panel{gap:5px;padding:6px 7px;margin:4px 0 8px;}.mansions-main{flex-basis:100%;gap:6px;}.mansions-heading{min-width:76px;}.mansions-chip{min-width:42px;padding:5px 4px;}.mansions-yiji{min-width:100%;flex-basis:100%;padding-left:2px;}}
  .date-picker-trigger{position:relative;width:30px;height:29px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #ded5c2;border-radius:7px;background:#fffdf7;color:#6d756a;font-size:16px;cursor:pointer;overflow:hidden;flex:0 0 auto;}

  .records-dialog{width:min(640px,calc(100vw - 28px));max-height:min(76vh,760px);border:1px solid #d8cfbd;border-radius:15px;padding:0;background:#fffdf7;color:var(--ink);box-shadow:0 18px 65px #0003;}

  /* v83: separate 月破 from the branch token's seasonal fill and 旬空 outline.
     Grey fill = 休囚死; dotted purple border = 旬空; red corner badge = 月破. */
  .drop-token.branch-token{
    width:27px;min-width:27px;height:27px;box-sizing:border-box;
    display:inline-flex;align-items:center;justify-content:center;
    border:2px solid transparent;border-radius:50%;
    padding:0;line-height:1;position:relative;overflow:visible;
  }
  .drop-token.branch-token.is-monthly-wangxiang{
    border:3px solid var(--monthly-ring);
    background:var(--monthly-bg)!important;
  }
  .drop-token.branch-token.is-monthly-xiuqiu{
    border:2px solid transparent;
    background:var(--monthly-bg,#666666)!important;
  }
  .drop-token.branch-token.is-xunkong{
    background:var(--monthly-bg,#f2effa)!important;
  }
  /* Keep 旬空 as an independent outer ring so it remains visible alongside
     monthly 旺相 rings, 休囚死 fills and the 月破 corner marker. */
  .drop-token.branch-token.is-xunkong::before{
    content:'';
    position:absolute;
    inset:-4px;
    border:2px dotted #7567a6;
    border-radius:50%;
    pointer-events:none;
  }
  .drop-token.branch-token.is-month-break{
    background:var(--monthly-bg,#fff0ed)!important;
  }
  .drop-token.branch-token.is-month-break::after{
    content:'破';
    position:absolute;right:-5px;top:-6px;z-index:3;
    width:12px;height:12px;display:grid;place-items:center;
    border:1px solid #fffdf7;border-radius:50%;
    background:#c44738;color:#fffdf7;
    font-size:7px;line-height:1;font-weight:900;
    box-shadow:0 0 0 1px #c44738;
    pointer-events:none;

<script>
(function(){
  'use strict';
  const yangBranches = ['子','寅','辰','午','申','戌'];
  const yinBranches = ['丑','亥','酉','未','巳','卯'];
  const relations = ['父母','兄弟','子孙','妻财','官鬼'];
  const sixGods = ['青龙','朱雀','勾陈','螣蛇','白虎','玄武'];
  const sixGodClasses = {'青龙':'god-qinglong','朱雀':'god-zhuque','勾陈':'god-gouchen','螣蛇':'god-tengshe','白虎':'god-baihu','玄武':'god-xuanwu'};
  const dayStemFirstGod = {'甲':'青龙','乙':'青龙','丙':'朱雀','丁':'朱雀','戊':'勾陈','己':'螣蛇','庚':'白虎','辛':'白虎','壬':'玄武','癸':'玄武'};
  let expectedDayGod = null;
  const effects = ['克','生','回头生','回头克','泄','化进','化退'];

  // v64: beginner-friendly question categories in one dropdown, with compact 六亲 reminders.
  const QUESTION_CATALOG = [
    {value:'daily',label:'今日运势（每日卦）',useGod:'无固定用神',hint:'没有固定六亲用神，以世爻为主，再结合日月、动爻与全卦关系。'},
    {value:'wealth',label:'财运、投资、项目',useGod:'妻财',hint:'子孙、兄弟'},
    {value:'promotion',label:'升职、求官、功名',useGod:'官鬼',hint:'同时留意父母（支持）、子孙（克官）。'},
    {value:'study',label:'学习、文书、证件',useGod:'父母',hint:'考试、资格、合同等，重点留意父母爻。'},
    {value:'children',label:'子女、求子',useGod:'子孙',hint:'重点留意子孙爻；胎象等细节以后再逐步学习。'},
    {value:'male-marriage',label:'男性自问婚姻',useGod:'妻财',hint:'妻财代表所问的女方／妻子。'},
    {value:'female-marriage',label:'女性自问婚姻',useGod:'官鬼',hint:'官鬼代表所问的男方／丈夫。'},
    {value:'parents',label:'问父母、父母病情',useGod:'父母',hint:'重点留意父母爻；子女代问父母时尤其注意。'},
    {value:'annual',label:'年度整体运势',useGod:'无固定用神',hint:'没有固定六亲用神，以世爻为主，再按需要看财、官、父母、子孙。'}
  ];
  const questionCategoryEl=document.getElementById('question-category');
  const questionTextEl=document.getElementById('question-text');
  const questionUseGodEl=document.getElementById('question-usegod');
  const questionHintEl=document.getElementById('question-hint');
  const caseToggleButton=document.getElementById('toggle-case');
  const caseMetaEl=document.getElementById('case-meta');

  const caseReviewField=document.getElementById('case-review-field');
  const caseReviewStatusSelect=document.getElementById('case-review-status');
  const caseConclusionField=document.getElementById('case-conclusion-field');
  const caseConclusionTextarea=document.getElementById('case-conclusion');
  const caseMemoTitle=document.getElementById('memo-title');
  const caseMemoHint=document.getElementById('case-memo-hint');
  const memoHeader=document.querySelector('.worksheet-memo-header');
  const memoTextarea=document.getElementById('daily-memo');
  const manualPillarValidation=document.getElementById('manual-pillar-validation');
  const dailyModeButton=document.getElementById('mode-daily');
  const classroomModeButton=document.getElementById('mode-classroom');
  const CASE_REVIEW_LABELS={pending:'待核对',verified:'已核实',disputed:'存在分歧'};
  let isCaseRecord=false;
  let manualPillarOverride={enabled:false,year:{stem:'',branch:''},month:{stem:'',branch:''},day:{stem:'',branch:''}};
  // Keep the daily worksheet and classroom-case worksheet as separate in-memory drafts.
  // Drafts are scoped to the selected archive date and survive mode switches in this tab.
  const entryModeDraftCache={daily:new Map(),classroom:new Map()};
  function updateCaseEditor(){
    caseToggleButton.textContent=isCaseRecord?'已标记为案例':'标记为案例';
    caseToggleButton.classList.toggle('primary',isCaseRecord);
    caseToggleButton.setAttribute('aria-pressed',String(isCaseRecord));
    // Classroom case notes are intentionally a plain text area; legacy metadata
    // remains hidden for backwards-compatible loading, but is no longer shown.
    caseMetaEl.hidden=true;
    caseReviewField.hidden=true;
    caseConclusionField.hidden=!isCaseRecord;
    memoHeader.hidden=isCaseRecord;
    document.querySelectorAll('.calendar-value').forEach(node=>{node.hidden=isCaseRecord;});
    document.querySelectorAll('.case-inline-pillar').forEach(node=>{node.hidden=!isCaseRecord;});
    const stemSource=document.getElementById('case-stem-source');
    if(stemSource) stemSource.hidden=!isCaseRecord;
    caseMemoTitle.textContent=isCaseRecord?'':'每日记录 Memo';
    memoTextarea.setAttribute('aria-label',isCaseRecord?'老师的分析':'每日记录 Memo');
    memoTextarea.placeholder=isCaseRecord?'':'记录当天的观察和复盘…';
    caseMemoHint.textContent='';
    if(dailyModeButton){
      dailyModeButton.classList.toggle('active',!isCaseRecord);
      dailyModeButton.setAttribute('aria-pressed',String(!isCaseRecord));
    }
    if(classroomModeButton){
      classroomModeButton.classList.toggle('active',isCaseRecord);
      classroomModeButton.setAttribute('aria-pressed',String(isCaseRecord));
    }
  }
  function setCaseEditor(record=null){
    isCaseRecord=record?.isCase===true;
    caseSourceSelect.value=record?.caseSource==='practice'?'practice':'classroom';
    caseReviewStatusSelect.value=Object.prototype.hasOwnProperty.call(CASE_REVIEW_LABELS,record?.caseReviewStatus)?record.caseReviewStatus:'pending';
    caseConclusionTextarea.value=typeof record?.caseConclusion==='string'?record.caseConclusion:'';
    const saved=record?.pillarOverride;

  function animatePaletteTokenToSlot(tile,target){
    if(!tile||!target||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;

    const ghost=tile.cloneNode(true);
    ghost.classList.remove('selected');
    ghost.classList.add('auto-place-ghost');
    ghost.removeAttribute('aria-label');
    ghost.style.left=fromRect.left+'px';
    ghost.style.top=fromRect.top+'px';
    ghost.style.width=fromRect.width+'px';
    ghost.style.height=fromRect.height+'px';
    document.body.appendChild(ghost);
    const dx=toRect.left+toRect.width/2-(fromRect.left+fromRect.width/2);
    const dy=toRect.top+toRect.height/2-(fromRect.top+fromRect.height/2);
    const scale=Math.min(1,toRect.width/fromRect.width,toRect.height/fromRect.height)*0.88;
    requestAnimationFrame(()=>{
      ghost.style.transform='translate('+dx+'px,'+dy+'px) scale('+scale+')';

    repeatedLine.textContent=repeated.length
      ?'多现：'+repeated.map(item=>item.relation+'×'+item.count).join('、')
      :(missingCount===0?'多现：无':'多现：目前未见');
    const absentLine=document.createElement('span');
    absentLine.textContent=missingCount>0
      ?'未录全：'+knownKinValues.length+'/8，暂不判断不上卦'
      :(absent.length?'不上卦：'+absent.map(item=>item.relation).join('、'):'不上卦：无');
    summary.append(repeatedLine,absentLine);
    dateBranchSidecar.appendChild(summary);
    dateBranchSidecar.appendChild(clearCurrentEntryButton);
  }

  // 日月参与三合候选：
  // A：同一卦体内两个（明动或暗动）爻，其中至少一个是允许发动的锚点；日支或月支补第三支。
  // B：一个允许发动的锚点爻；日支、月支分别补足另外两支。申子辰允许子、辰发动。
  // 这两种显示为不同状态，不将流派分歧隐藏掉。
  function findDateTrineCombinations(lineSource=state,monthSource=currentMonthBranch,daySource=currentDayBranch){
    const combinations=[],seen=new Set();
    const dateSources=[{source:'month',branch:monthSource},{source:'day',branch:daySource}].filter(x=>!!x.branch);
    trineDefinitions.forEach(definition=>{
      const [outerA,middle,outerB]=definition.branches;
      const activeLines=lineSource.map((item,id)=>({item,id,motion:getLineMovementInfo(item,daySource)}))
        .filter(entry=>entry.motion&&entry.item.branch&&definition.branches.includes(entry.item.branch));
      const activationLines=activeLines.filter(entry=>isTrineActivationBranch(definition,entry.item.branch));
      activeLines.forEach(entry=>{
        const transformed=entry.item.changeBranch;
        if(!transformed||transformed===entry.item.branch||!definition.branches.includes(transformed)||!isTrineActivationBranch(definition,entry.item.branch)) return;
        const missing=definition.branches.find(branch=>branch!==entry.item.branch&&branch!==transformed);
        const dateSource=dateSources.find(item=>item.branch===missing);
        if(!missing||!dateSource) return;
        const key=['C',definition.element,entry.id,dateSource.source].join(':');
        if(seen.has(key)) return;
        seen.add(key);
        combinations.push({mode:'C',definition,dateSource:dateSource.source,dateBranch:missing,lineIds:[entry.id],anchorLineId:entry.id,motionKinds:[entry.motion.kind],anchorBranch:entry.item.branch,transformedBranch:transformed});
      });
      for(let i=0;i<activeLines.length;i++) for(let j=i+1;j<activeLines.length;j++){
        const first=activeLines[i],second=activeLines[j];
        if(first.item.branch===second.item.branch||Math.floor(first.id/3)!==Math.floor(second.id/3)) continue;
        const anchorLine=isTrineActivationBranch(definition,first.item.branch)?first:isTrineActivationBranch(definition,second.item.branch)?second:null;
        if(!anchorLine) continue;
        const missing=definition.branches.find(branch=>branch!==first.item.branch&&branch!==second.item.branch);
        const dateSource=dateSources.find(item=>item.branch===missing);
        if(!missing||!dateSource) continue;
        const key=['A',definition.element,first.id,second.id,dateSource.source].join(':');
        if(seen.has(key)) continue;
        seen.add(key);
        combinations.push({mode:'A',definition,dateSource:dateSource.source,dateBranch:missing,lineIds:[first.id,second.id],anchorLineId:anchorLine.id,motionKinds:[first.motion.kind,second.motion.kind]});
      }
      if(monthSource&&daySource&&monthSource!==daySource&&activeLines.length===1&&activationLines.length===1){
        const dateSet=new Set([monthSource,daySource]),requiredOuter=new Set([outerA,outerB]);
        const exactlyOuter=dateSet.size===2&&[...dateSet].every(branch=>requiredOuter.has(branch))&&[...requiredOuter].every(branch=>dateSet.has(branch));
        if(exactlyOuter) activationLines.forEach(entry=>{
          const key=['B',definition.element,entry.id,monthSource,daySource].join(':');
          if(seen.has(key)) return;
          seen.add(key);
          combinations.push({mode:'B',definition,dateSource:null,dateBranch:null,lineIds:[entry.id],anchorLineId:entry.id,motionKinds:[entry.motion.kind]});
        });
      }
    });
    const preferredTrines=new Set(combinations.filter(item=>item.mode==='C').map(item=>item.definition.element));
    const priority={C:0,A:1,B:2};
    return combinations.filter(item=>item.mode==='C'||!preferredTrines.has(item.definition.element))
      .sort((a,b)=>priority[a.mode]-priority[b.mode]||a.lineIds[0]-b.lineIds[0]);
  }

  function findIntraHexagramTrines(lineSource=state,daySource=currentDayBranch,dateCombinations=[]){
    const combinations=[],seen=new Set();
    const preferredDateAnchors=new Set((dateCombinations||[]).filter(item=>item.mode==='C').map(item=>item.definition.element+':'+item.anchorLineId));
    for(let movingId=0;movingId<lineSource.length;movingId++){
      const movingItem=lineSource[movingId],movingInfo=getLineMovementInfo(movingItem,daySource);
      if(!movingInfo||!movingItem.branch||!movingItem.changeBranch||movingItem.branch===movingItem.changeBranch) continue;
      const sameTrigramIds=movingId<3?[0,1,2]:[3,4,5];
      if(!sameTrigramIds.every(id=>lineSource[id]&&lineSource[id].flowers!==null&&lineSource[id].flowers!==undefined)) continue;
      const definition=trineDefinitions.find(trine=>trine.branches.includes(movingItem.branch)&&trine.branches.includes(movingItem.changeBranch));
      if(!definition||!isTrineActivationBranch(definition,movingItem.branch)||preferredDateAnchors.has(definition.element+':'+movingId)) continue;
      const missingBranch=definition.branches.find(branch=>branch!==movingItem.branch&&branch!==movingItem.changeBranch);
      if(!missingBranch) continue;
      for(const partnerId of sameTrigramIds){
        if(partnerId===movingId||lineSource[partnerId]?.branch!==missingBranch) continue;
        const key=[definition.element,movingId,partnerId].join(':');
        if(seen.has(key)) continue;
        seen.add(key);
        combinations.push({name:definition.label,element:definition.element,mode:'same-trigram',
          movingLineNumber:movingId+1,partnerLineNumber:partnerId+1,movementKind:movingInfo.kind,
          participants:[
            {source:'line',lineNumber:movingId+1,side:'本卦',branch:movingItem.branch},
            {source:'line',lineNumber:movingId+1,side:'变卦',branch:movingItem.changeBranch},
            {source:'line',lineNumber:partnerId+1,side:'本卦',branch:missingBranch}
          ]});
      }
    }
    return combinations;
  }

  function serializeDateTrineCombination(combination,lineSource,monthBranch,dayBranch){
    const participants=[];
    if(combination.mode==='C'){
      const id=combination.lineIds[0],line=lineSource[id]||{};
      participants.push({source:'line',lineNumber:id+1,side:'本卦',branch:line.branch||combination.anchorBranch||null},
        {source:'line',lineNumber:id+1,side:'变卦',branch:line.changeBranch||combination.transformedBranch||null},
        {source:combination.dateSource,branch:combination.dateBranch});
    }else if(combination.mode==='A'){
      combination.lineIds.forEach(id=>participants.push({source:'line',lineNumber:id+1,side:'本卦',branch:lineSource[id]?.branch||null}));
      participants.push({source:combination.dateSource,branch:combination.dateBranch});
    }else{
      participants.push({source:'month',branch:monthBranch},{source:'day',branch:dayBranch},
        {source:'line',lineNumber:combination.lineIds[0]+1,side:'本卦',branch:lineSource[combination.lineIds[0]]?.branch||null});
    }
    return {name:combination.definition.label,element:combination.definition.element,mode:combination.mode,
      modeLabel:{C:'动爻本支＋变支＋日/月支',A:'同一卦体两条动爻＋日/月支',B:'月支＋日支＋中神动爻'}[combination.mode],
      lineNumbers:[...new Set(participants.filter(item=>item.source==='line').map(item=>item.lineNumber))],
      anchorLineNumber:Number.isInteger(combination.anchorLineId)?combination.anchorLineId+1:null,
      motionKinds:[...(combination.motionKinds||[])],participants};
  }

  function buildRecordAnalysisSnapshot(record){
    const recordLines=Array.isArray(record?.lines)?record.lines:[];
    const monthPillar=String(record?.pillars?.month||''),dayPillar=String(record?.pillars?.day||'');
    const monthCandidate=monthPillar.slice(-1),dayCandidate=dayPillar.slice(-1);
    const monthBranch=GANZHI_BRANCHES.includes(monthCandidate)?monthCandidate:(record?.analysisSnapshot?.calendar?.monthBranch||null);
    const dayBranch=GANZHI_BRANCHES.includes(dayCandidate)?dayCandidate:(record?.analysisSnapshot?.calendar?.dayBranch||null);
    const calculatedXunkong=dayPillar?calculateXunkongBranches(dayPillar):[];
    const storedXunkong=[record?.calendarAssignments?.xunkong1,record?.calendarAssignments?.xunkong2].filter(Boolean);
    const xunkongBranches=calculatedXunkong.length===2?calculatedXunkong:storedXunkong;
    const xunkongKnown=xunkongBranches.length===2,monthRule=monthWangXiang[monthBranch]||null;
    const elementNames={water:'水',wood:'木',earth:'土',fire:'火',metal:'金'};
    function branchSnapshot(branch){
      if(!branch) return null;
      const monthly=getMonthlyBranchState(branch,monthBranch);
      return {branch,element:branchElements[branch]||null,elementName:elementNames[branchElements[branch]]||null,
        monthStatus:monthly?.status||null,monthStatusGroup:monthly?.group||null,monthRule:monthRule?.label||null,
        monthBreak:monthBranch?sixClashes[monthBranch]===branch:null,xunkong:xunkongKnown?xunkongBranches.includes(branch):null};
    }
    const pattern=recordLines.length===6&&recordLines.every(line=>[0,1,2,3].includes(line.flowers))
      ?recordLines.map(line=>mapping[line.flowers]?.yang?'1':'0').join(''):null;
    const hexagram=pattern?hexagramData[pattern]||null:null;
    const shiLineNumber=hexagram?.shi||null,yingLineNumber=shiLineNumber?((shiLineNumber-1+3)%6)+1:null;
    const lineSnapshots=recordLines.map((line,index)=>{
      const movement=getLineMovementInfo(line,dayBranch);
      return {lineNumber:index+1,position:['初爻','二爻','三爻','四爻','五爻','上爻'][index]||'',
        role:index+1===shiLineNumber?'世爻':(index+1===yingLineNumber?'应爻':null),flowers:line.flowers,
        relation:line.relation||null,hiddenRelation:relations.includes(line.hiddenRelation)?line.hiddenRelation:null,sixGod:line.shen||null,movement:movement?movement.kind:null,
        original:branchSnapshot(line.branch),transformed:movement&&line.changeBranch?branchSnapshot(line.changeBranch):null,
        changeRelation:movement?(line.changeRelation||null):null,effect:movement?(line.effect||''):''};
    });
    const branchTokens=[];
    lineSnapshots.forEach(line=>{
      if(line.original) branchTokens.push({lineNumber:line.lineNumber,position:line.position,side:'本卦',snapshot:line.original});
      if(line.transformed) branchTokens.push({lineNumber:line.lineNumber,position:line.position,side:'变卦',snapshot:line.transformed});
    });
    const sameLineLiuHe=[],betweenLinesLiuHe=[];
    for(let i=0;i<branchTokens.length;i++){
      for(let j=i+1;j<branchTokens.length;j++){
        const first=branchTokens[i],second=branchTokens[j];
        const sameLine=first.lineNumber===second.lineNumber;
        if(sameLine&&!(first.side==='本卦'&&second.side==='变卦')) continue;
        const pairInfo=getLiuHePairInfo(first.snapshot.branch,second.snapshot.branch);
        if(!pairInfo) continue;
        const entry={pair:pairInfo.pair,mode:sameLine?'same-line-original-to-transformed':'between-lines',
          first:{lineNumber:first.lineNumber,position:first.position,side:first.side,...first.snapshot},
          second:{lineNumber:second.lineNumber,position:second.position,side:second.side,...second.snapshot},
          fiveElementRelation:pairInfo.controlText?'control':(pairInfo.generationText?'generation':'none'),
          controlText:pairInfo.controlText||null,generationText:pairInfo.generationText||null,
          interpretation:pairInfo.hasControl?'合中带克：是否论克需比较双方力量':'六合：仍需结合问事与全卦判断',
          forceJudgement:'not-automatically-determined'};
        (sameLine?sameLineLiuHe:betweenLinesLiuHe).push(entry);
      }
    }
    const liuHeRule={source:'第十二课',title:'合中带克、克中带合与贪合忘克',
      principle:'六合与五行生克可能同时存在；不能见合就一概判断不克，也不能只见相克就忽略合。',
      forceComparison:'力量接近时可考虑贪合忘克、以合为主；若克制一方力量明显强于被克一方，仍须论克。',
      assessmentFactors:'结合月令旺衰、日辰生扶克制、卦中其他动爻及整体卦局比较双方力量。',
      automation:'页面只识别六合配对并保存五行生克与旺衰背景，不自动判定贪合忘克是否成立。'};
    let shiYing=null;
    if(shiLineNumber&&yingLineNumber){
      const shiBranch=recordLines[shiLineNumber-1]?.branch,yingBranch=recordLines[yingLineNumber-1]?.branch;
      const shiElement=branchElements[shiBranch],yingElement=branchElements[yingBranch];
      if(shiElement&&yingElement){
        let kind='比和';
        if(shiElement!==yingElement){
          if(generates[shiElement]===yingElement) kind='世生应';
          else if(generates[yingElement]===shiElement) kind='应生世';
          else if(controls[shiElement]===yingElement) kind='世克应';
          else if(controls[yingElement]===shiElement) kind='应克世';
        }
        shiYing={kind,shiLineNumber,yingLineNumber,shiBranch,yingBranch,shiElement,yingElement};
      }
    }
    const dateCombinations=findDateTrineCombinations(recordLines,monthBranch,dayBranch);
    const dateTrines=dateCombinations.map(item=>serializeDateTrineCombination(item,recordLines,monthBranch,dayBranch));
    const intraTrines=findIntraHexagramTrines(recordLines,dayBranch,dateCombinations);
    return {schemaVersion:5,calculatedAt:new Date().toISOString(),calculationSource:'saved-pillars-and-line-inputs',
      calendar:{yearPillar:String(record?.pillars?.year||'')||null,monthPillar:monthPillar||null,dayPillar:dayPillar||null,
        pillarSource:record?.pillarSource||'calendar-date',
        monthBranch,dayBranch,monthWangXiangRule:monthRule?.label||null,
        xunkongBranches:[...xunkongBranches],xunkongKnown},
      pillarOverride:record?.pillarOverride?.enabled?JSON.parse(JSON.stringify(record.pillarOverride)):null,
      hexagram:hexagram?{name:hexagram.full,palace:hexagram.palace,element:hexagram.element,
        elementName:elementNames[hexagram.element]||null,stage:hexagram.stage,shiLineNumber,yingLineNumber}:null,
      lines:lineSnapshots,shiYing,trines:{dateBased:dateTrines,withinHexagram:intraTrines},
      branchRelations:{sameLineLiuHe,betweenLinesLiuHe,lessonRule:liuHeRule}};
  }

  // v57: 日期地支固定在最上面一行，并以第一条（上爻）纳甲槽的列中心定位。
  // 定位使用空槽本身，而不是内部 token，避免未填上爻时错误吸附到其他已填写的爻位。
  function positionDateBranchSidecar(combination){
    if(!dateBranchSidecar||!rowsHost) return null;
    const topGroup=rowsHost.querySelector('.trigram-group-rows');
    const topBranchSlot=topGroup?.querySelector(':scope > .line-row:first-child [data-zone="branch"]');
    if(!topGroup||!topBranchSlot) return null;
    if(dateBranchSidecar.parentElement!==topGroup) topGroup.appendChild(dateBranchSidecar);
    const groupRect=topGroup.getBoundingClientRect();
    const targetRect=topBranchSlot.getBoundingClientRect();
    const sideRect=dateBranchSidecar.getBoundingClientRect();
    const branchItems=[...dateBranchSidecar.querySelectorAll('.date-branch-item')];
    const firstBranchRect=branchItems[0]?.getBoundingClientRect();
    const lastBranchRect=branchItems[branchItems.length-1]?.getBoundingClientRect();
    const desiredCenter=targetRect.left-groupRect.left+targetRect.width/2;
    const branchGroupWidth=firstBranchRect&&lastBranchRect
      ?lastBranchRect.right-firstBranchRect.left
      :sideRect.width;
    dateBranchSidecar.style.left=(desiredCenter-branchGroupWidth/2)+'px';
    dateBranchSidecar.style.top=(-sideRect.height-7)+'px';
    return combination||null;
  }

  // v57: hexagram name, palace element and Shi/Ying relation sit at the upper-right edge.
  // They share the top header band instead of being vertically centered beside the top line.
  function positionHexagramHeading(){
    const heading=document.querySelector('.hexagram-heading');
    const subhead=document.querySelector('.worksheet-subhead');
    const firstRow=rowsHost?.querySelector('.line-row');
    if(!heading||!subhead||!firstRow) return;
    const subRect=subhead.getBoundingClientRect();
    const rowRect=firstRow.getBoundingClientRect();
    const headRect=heading.getBoundingClientRect();
    const left=rowRect.right-subRect.left+12;
    const available=subRect.width-left-10;
    if(available>=headRect.width){
      heading.style.left=left+'px';
      heading.style.top='0px';
    }else{
      // Narrow screens: keep the heading in a compact top band above the rows.
      heading.style.left='0px';
      heading.style.top='0px';
    }
  }
  function svgNode(name,attrs){
    const node=document.createElementNS(SVG_NS,name);
    Object.entries(attrs||{}).forEach(([key,value])=>node.setAttribute(key,String(value)));
    return node;
  }
  function rectCenter(rect,hostRect){
    return {x:rect.left-hostRect.left+rect.width/2,y:rect.top-hostRect.top+rect.height/2};
  }
  // Stop connecting lines at the outside edge of each branch slot, so the line
  // never runs through the branch character itself.
  function edgePoint(center,target,rect,pad=3){
    const dx=target.x-center.x,dy=target.y-center.y;
    if(Math.abs(dx)<.001&&Math.abs(dy)<.001) return center;
    const tx=Math.abs(dx)>.001?(rect.width/2+pad)/Math.abs(dx):Infinity;
    const ty=Math.abs(dy)>.001?(rect.height/2+pad)/Math.abs(dy):Infinity;
    const t=Math.min(tx,ty,1);
    return {x:center.x+dx*t,y:center.y+dy*t};
  }
  function keepSlotsVisibleInRow(row,slots){
    if(!row || !slots.length || row.clientWidth<=0) return;
    const rowRect=row.getBoundingClientRect();
    const positions=slots.map(slot=>{
      const rect=slot.getBoundingClientRect();
      return {left:rect.left-rowRect.left+row.scrollLeft,right:rect.right-rowRect.left+row.scrollLeft};
    });
    const left=Math.min(...positions.map(item=>item.left));
    const right=Math.max(...positions.map(item=>item.right));
    const margin=8;
    if(right-left>row.clientWidth-margin*2) return;
    let target=row.scrollLeft;
    if(left-target<margin) target=left-margin;
    if(right-target>row.clientWidth-margin) target=right-row.clientWidth+margin;
    target=Math.max(0,Math.min(row.scrollWidth-row.clientWidth,target));
    if(Math.abs(target-row.scrollLeft)>1) row.scrollLeft=target;
  }
  function renderTrineOverlay(){
    const dateCombinations=arguments.length?(arguments[0]||[]):findDateTrineCombinations();
    const preferredDateAnchors=new Set(dateCombinations.filter(item=>item.mode==='C')
      .map(item=>item.definition.element+':'+item.anchorLineId));
    if(!trineOverlay || !worksheetHost) return;
    const hostRect=worksheetHost.getBoundingClientRect();
    const width=Math.max(1,worksheetHost.clientWidth);
    const height=Math.max(1,worksheetHost.scrollHeight);
    trineOverlay.setAttribute('width',width);
    trineOverlay.setAttribute('height',height);
    trineOverlay.setAttribute('viewBox','0 0 '+width+' '+height);
    trineOverlay.replaceChildren();
    const drawn=new Set();
    for(let movingId=0;movingId<6;movingId++){
      const movingItem=state[movingId];
      const movingInfo=getLineMovementInfo(movingItem);
      if(!movingInfo) continue;
      if(!movingItem.branch || !movingItem.changeBranch || movingItem.branch===movingItem.changeBranch) continue;
      const sameTrigramIds=movingId<3?[0,1,2]:[3,4,5];
      // Wait until this upper/lower trigram is fully known. The other trigram
      // does not need to be complete for this local overlay to be meaningful.
      if(!sameTrigramIds.every(lineId=>state[lineId].flowers!==null)) continue;
      const matchingTrine=trineDefinitions.find(trine=>
        trine.branches.includes(movingItem.branch)&&trine.branches.includes(movingItem.changeBranch)
      );
      if(!matchingTrine || !isTrineActivationBranch(matchingTrine,movingItem.branch)) continue;
      if(preferredDateAnchors.has(matchingTrine.element+':'+movingId)) continue;
      const missingBranch=matchingTrine.branches.find(branch=>branch!==movingItem.branch&&branch!==movingItem.changeBranch);
      if(!missingBranch) continue;

      for(const thirdId of sameTrigramIds){
        if(thirdId===movingId || state[thirdId].branch!==missingBranch) continue;
        const key=[matchingTrine.element,movingId,thirdId].join(':');
        if(drawn.has(key)) continue;
        drawn.add(key);
        const slotNodes=[
          rowsHost.querySelector('[data-line-id="'+movingId+'"][data-zone="branch"]'),
          rowsHost.querySelector('[data-line-id="'+movingId+'"][data-zone="changeBranch"]'),
          rowsHost.querySelector('[data-line-id="'+thirdId+'"][data-zone="branch"]')
        ];
        if(slotNodes.some(node=>!node)) continue;
        const movingRow=slotNodes[0].closest('.line-row');
        const thirdRow=slotNodes[2].closest('.line-row');
        keepSlotsVisibleInRow(movingRow,[slotNodes[0],slotNodes[1]]);
        keepSlotsVisibleInRow(thirdRow,[slotNodes[2]]);
        const rects=slotNodes.map(node=>node.getBoundingClientRect());
        if(rects.some(rect=>rect.width<=0||rect.height<=0)) continue;
        const points=rects.map(rect=>rectCenter(rect,hostRect));
        const area=Math.abs((points[1].x-points[0].x)*(points[2].y-points[0].y)-(points[2].x-points[0].x)*(points[1].y-points[0].y));
        if(area<120) continue;

        const group=svgNode('g',{'class':'trine-group','data-trine':matchingTrine.label,'data-moving-line':movingId+1,'data-third-line':thirdId+1});
        const polygon=svgNode('polygon',{
          points:points.map(point=>point.x+','+point.y).join(' '),
          fill:matchingTrine.color,
          'fill-opacity':'.055',
          'class':'trine-fill'
        });
        group.appendChild(polygon);
        [[0,1],[1,2],[2,0]].forEach(([a,b])=>{
          const start=edgePoint(points[a],points[b],rects[a]);
          const end=edgePoint(points[b],points[a],rects[b]);
          group.appendChild(svgNode('line',{
            x1:start.x,y1:start.y,x2:end.x,y2:end.y,
            stroke:matchingTrine.color,'class':'trine-edge'
          }));
        });
        // A colored outline around each participating branch slot makes the
        // three vertices explicit without obscuring the actual branch text.
        rects.forEach(rect=>group.appendChild(svgNode('rect',{
          x:rect.left-hostRect.left-2,
          y:rect.top-hostRect.top-2,
          width:rect.width+4,
          height:rect.height+4,
          rx:8,ry:8,
          fill:'none',stroke:matchingTrine.color,'stroke-width':2.6,
          'class':'trine-node'
        })));
        const title=svgNode('title');
        title.textContent=matchingTrine.label+'：第'+(movingId+1)+'爻'+movingInfo.kind+'（发动支'+movingItem.branch+'），本卦'+movingItem.branch+'、变卦'+movingItem.changeBranch+'，与第'+(thirdId+1)+'爻本卦'+missingBranch+'组成；限同一上卦/下卦。';
        group.appendChild(title);
        trineOverlay.appendChild(group);
      }
    }

    // 日月参与三合绘图；Mode C 优先展示同一动爻的本支→变支，再由日/月支补第三支。
    positionDateBranchSidecar(dateCombinations[0]||null);
    positionHexagramHeading();
    dateCombinations.forEach(combination=>{

        sourceText='第'+(lineId+1)+'爻'+motionKinds[0]+'：'+(baseToken?.textContent.trim()||'')+'→'+(changeToken?.textContent.trim()||'')+' + '+(dateSource==='month'?'月支':'日支')+(dateToken?.textContent.trim()||'');
      }else if(mode==='A'){

        sourceText='月支'+currentMonthBranch+' + 日支'+currentDayBranch+' + 第'+(lineIds[0]+1)+'爻'+motionKinds[0];
      }
      if(nodes.some(node=>!node)) return;
      const rects=nodes.map(node=>node.getBoundingClientRect());
      if(!rects.every(rect=>rect.width>0&&rect.height>0)) return;
      const points=rects.map(rect=>rectCenter(rect,hostRect));
      const area=Math.abs((points[1].x-points[0].x)*(points[2].y-points[0].y)-(points[2].x-points[0].x)*(points[1].y-points[0].y));
      if(area<70) return;
      const group=svgNode('g',{
        'class':'trine-group date-trine-group mode-'+mode.toLowerCase(),
        'data-trine':definition.label,
        'data-mode':mode,
        'data-lines':lineIds.map(id=>id+1).join(',')
      });
      group.appendChild(svgNode('polygon',{
        points:points.map(point=>point.x+','+point.y).join(' '),
        fill:definition.color,'fill-opacity':mode==='C'?'.055':(mode==='A'?'.045':'.035'),
        'class':'date-trine-fill'
      }));
      [[0,1],[1,2],[2,0]].forEach(([a,b])=>{
        const start=edgePoint(points[a],points[b],rects[a],2);
        const end=edgePoint(points[b],points[a],rects[b],2);
        group.appendChild(svgNode('line',{
          x1:start.x,y1:start.y,x2:end.x,y2:end.y,
          stroke:definition.color,
          'class':'date-trine-edge mode-'+mode.toLowerCase()
        }));

      const activationNote=definition.element==='water'?'申子辰允许子爻或辰爻发动。':'须由中神爻发动。';
      const modeNote=mode==='C'?'同一条发动爻的本卦地支与变卦地支组成两支，日支或月支补第三支。':(mode==='A'?'另一个动爻与发动爻须在同一卦体，日支或月支补第三支。':'日支和月支补足另外两支。');
      title.textContent=definition.label+' · 方式'+mode+'：'+sourceText+'。'+activationNote+modeNote;
      group.appendChild(title);

    });

  // 六合爻位连线：本卦初/二/三爻分别与四/五/上爻配对。
  // 只有对应两爻的纳甲地支确实互为六合时才画虚线；三组都出现时即呈现完整六合卦。
  const liuhePairColors={
    '子丑':'#89613f','寅亥':'#32844b','卯戌':'#c44738',
    '辰酉':'#b98519','巳申':'#2677b8','午未':'#89613f'
  };
  function renderLiuheOverlay(){
    if(!liuheOverlay || !rowsHost) return;
    const hostRect=rowsHost.getBoundingClientRect();
    const width=Math.max(1,rowsHost.clientWidth);
    const height=Math.max(1,rowsHost.scrollHeight);
    liuheOverlay.setAttribute('width',width);
    liuheOverlay.setAttribute('height',height);
    liuheOverlay.setAttribute('viewBox','0 0 '+width+' '+height);
    liuheOverlay.replaceChildren();
    const pairs=[[0,3],[1,4],[2,5]];
    pairs.forEach(([lowerId,upperId],pairIndex)=>{
      const lower=state[lowerId]?.branch;
      const upper=state[upperId]?.branch;
      if(!lower || !upper) return;
      const relation=liuHe[lower];
      if(!relation || relation.partner!==upper) return;
      const lowerSlot=rowsHost.querySelector('[data-line-id="'+lowerId+'"][data-zone="branch"]');
      const upperSlot=rowsHost.querySelector('[data-line-id="'+upperId+'"][data-zone="branch"]');
      if(!lowerSlot || !upperSlot) return;
      const lowerRect=lowerSlot.getBoundingClientRect();
      const upperRect=upperSlot.getBoundingClientRect();
      if(lowerRect.width<=0||upperRect.width<=0||lowerRect.height<=0||upperRect.height<=0) return;
      const lowerCenter=rectCenter(lowerRect,hostRect);
      const upperCenter=rectCenter(upperRect,hostRect);
      const lowerPoint=edgePoint(lowerCenter,upperCenter,lowerRect,2);
      const upperPoint=edgePoint(upperCenter,lowerCenter,upperRect,2);
      // Route the dashed curve just outside the 纳甲 slot's left edge to keep
      // the branch glyphs readable while visually tying the two爻位 together.
      const laneX=Math.min(lowerCenter.x,upperCenter.x)-(15+pairIndex*11);
      const key=relation.pair;
      const color=liuhePairColors[key]||'#89613f';
      const group=svgNode('g',{'class':'liuhe-group','data-pair':key,'data-lower-line':lowerId+1,'data-upper-line':upperId+1});
      const path=svgNode('path',{
        d:'M '+lowerPoint.x+' '+lowerPoint.y+' C '+laneX+' '+lowerPoint.y+', '+laneX+' '+upperPoint.y+', '+upperPoint.x+' '+upperPoint.y,
        stroke:color,'class':'liuhe-edge'
      });
      group.appendChild(path);
      [lowerPoint,upperPoint].forEach(point=>group.appendChild(svgNode('circle',{
        cx:point.x,cy:point.y,r:2.4,fill:color,'class':'liuhe-endpoint'
      })));
      const title=svgNode('title');
      title.textContent='第'+(lowerId+1)+'爻'+lower+'与第'+(upperId+1)+'爻'+upper+'：'+key+'六合（'+relation.transform+'）';
      group.appendChild(title);
      liuheOverlay.appendChild(group);
    });
  }

  // v98: automatic Najia / 六亲 / 六神 with a non-destructive checker.
  // Pattern strings are bottom-to-top: 初爻 -> 上爻.
  const TRIGRAM_NAME_BY_PATTERN={'111':'乾','110':'兑','101':'离','100':'震','011':'巽','010':'坎','001':'艮','000':'坤'};
  const TRIGRAM_NAJIA_BRANCHES={
    '乾':{inner:['子','寅','辰'],outer:['午','申','戌']},
    '兑':{inner:['巳','卯','丑'],outer:['亥','酉','未']},
    '离':{inner:['卯','丑','亥'],outer:['酉','未','巳']},
    '震':{inner:['子','寅','辰'],outer:['午','申','戌']},
    '巽':{inner:['丑','亥','酉'],outer:['未','巳','卯']},
    '坎':{inner:['寅','辰','午'],outer:['申','戌','子']},
    '艮':{inner:['辰','午','申'],outer:['戌','子','寅']},
    '坤':{inner:['未','巳','卯'],outer:['丑','亥','酉']}
  };
  const AUTO_LINE_POSITIONS=['初爻','二爻','三爻','四爻','五爻','上爻'];
  const autoReviewReportEl=document.getElementById('auto-review-report');

  function clearAutoReviewReport(){
    document.querySelectorAll('.drop-slot.auto-check-error,.drop-slot.auto-check-missing').forEach(slot=>slot.classList.remove('auto-check-error','auto-check-missing'));
    if(autoReviewReportEl){autoReviewReportEl.hidden=true;autoReviewReportEl.replaceChildren();}
  }
  function najiaBranchesForPattern(pattern){
    if(typeof pattern!=='string'||!/^[01]{6}$/.test(pattern)) return null;
    const lower=TRIGRAM_NAJIA_BRANCHES[TRIGRAM_NAME_BY_PATTERN[pattern.slice(0,3)]];
    const upper=TRIGRAM_NAJIA_BRANCHES[TRIGRAM_NAME_BY_PATTERN[pattern.slice(3,6)]];
    return lower&&upper?[...lower.inner,...upper.outer]:null;
  }
  function sixKinForBranch(branch,palaceElement){
    const element=branchElements[branch];
    if(!element||!palaceElement) return null;
    if(element===palaceElement) return '兄弟';
    if(generates[palaceElement]===element) return '子孙';
    if(controls[palaceElement]===element) return '妻财';
    if(controls[element]===palaceElement) return '官鬼';
    if(generates[element]===palaceElement) return '父母';
    return null;
  }
  function buildAutoAssemblyPlan(){
    if(!state.every(item=>item.flowers!==null&&mapping[item.flowers])||!currentHexagramInfo){
      return {ready:false,entries:[],notes:['请先完成六次摇卦的阴阳输入，确定本卦后再自动装卦或检查。']};
    }
    const pattern=state.map(item=>mapping[item.flowers].yang?'1':'0').join('');
    const originalBranches=najiaBranchesForPattern(pattern);
    if(!originalBranches) return {ready:false,entries:[],notes:['无法识别当前上下卦的纳甲结构，请检查六爻阴阳输入。']};
    const palaceElement=currentHexagramInfo.element,entries=[],notes=[],originalKins=[];
    for(let i=0;i<6;i++){
      const branch=originalBranches[i],kin=sixKinForBranch(branch,palaceElement);
      if(!kin) return {ready:false,entries:[],notes:['无法根据本卦卦宫五行计算第'+(i+1)+'爻六亲。']};
      originalKins.push(kin);
      entries.push(
        {kind:'line',lineId:i,zone:'branch',label:AUTO_LINE_POSITIONS[i]+'纳甲地支',expected:branch},
        {kind:'line',lineId:i,zone:'relation',label:AUTO_LINE_POSITIONS[i]+'六亲',expected:kin}
      );
    }
    // 伏神规则：只有问事分类明确指定六亲用神，且该六亲没有出现在本卦六爻时，
    // 才从当前卦所属卦宫的本宫纯卦定位该六亲，并伏在对应爻位的飞神之下。
    // “世爻”类运势卦不是六亲用神，不自动生成伏神。
    const mainUseGod=String(QUESTION_CATEGORY_BY_VALUE.get(questionCategoryEl.value)?.useGod||'').trim();
    if(relations.includes(mainUseGod)&&!originalKins.includes(mainUseGod)){
      const palaceRoot=Object.entries(hexagramData).find(([,info])=>info.palace===currentHexagramInfo.palace&&info.stage==='本宫');
      const palaceBranches=palaceRoot?najiaBranchesForPattern(palaceRoot[0]):null;
      const hiddenLineIds=(palaceBranches||[]).map((branch,index)=>sixKinForBranch(branch,palaceElement)===mainUseGod?index:-1).filter(index=>index>=0);
      if(hiddenLineIds.length!==1){
        return {ready:false,entries:[],notes:['无法在'+currentHexagramInfo.palace+'宫本宫卦中唯一定位'+mainUseGod+'伏神，请人工核对。']};
      }
      const hiddenLineId=hiddenLineIds[0];
      entries.push({kind:'line',lineId:hiddenLineId,zone:'hiddenRelation',label:AUTO_LINE_POSITIONS[hiddenLineId]+'伏神',expected:mainUseGod});
    }
    const dayPillar=String(currentPillars?.day||''),dayStem=dayPillar.charAt(0);
    const firstGod=dayStemFirstGod[dayStem]||null;
    if(firstGod){
      const firstIndex=sixGods.indexOf(firstGod);
      for(let i=0;i<6;i++) entries.push({kind:'line',lineId:i,zone:'shen',label:AUTO_LINE_POSITIONS[i]+'六神',expected:sixGods[(firstIndex+i)%sixGods.length]});
      entries.push({kind:'calendar',key:'dayGod',label:'日干六神起神',expected:firstGod});
    }
    for(const key of ['year','month','day']){
      const pillar=String(currentPillars?.[key]||''),branch=pillar.charAt(1);
      if(GANZHI_STEMS.includes(pillar.charAt(0))&&GANZHI_BRANCHES.includes(branch)){
        const kin=sixKinForBranch(branch,palaceElement);
        if(kin) entries.push({kind:'calendar',key:key+'Relation',label:(key==='year'?'年':key==='month'?'月':'日')+'柱六亲',expected:kin});
      }
    }
    const transformedPattern=state.map(item=>{
      const bit=mapping[item.flowers].yang?'1':'0';
      return mapping[item.flowers].moving?(bit==='1'?'0':'1'):bit;
    }).join('');
    const transformedBranches=najiaBranchesForPattern(transformedPattern);
    if(!transformedBranches) return {ready:false,entries:[],notes:['变卦上下卦无法识别，停止装配以免写入错误纳甲。']};
    for(let i=0;i<6;i++){
      if(mapping[state[i].flowers].moving){
        const branch=transformedBranches[i],kin=sixKinForBranch(branch,palaceElement);
        if(kin) entries.push(
          {kind:'line',lineId:i,zone:'changeBranch',label:AUTO_LINE_POSITIONS[i]+'变卦纳甲地支',expected:branch},
          {kind:'line',lineId:i,zone:'changeRelation',label:AUTO_LINE_POSITIONS[i]+'变卦六亲',expected:kin}
        );
      }
    }
    return {ready:true,entries,notes,pattern,transformedPattern};
  }
  function readAutoEntry(entry){
    return entry.kind==='line'?(state[entry.lineId]?.[entry.zone]||''):(calendarAssignments[entry.key]||'');
  }
  function writeAutoEntry(entry,value){
    if(entry.kind==='line') state[entry.lineId][entry.zone]=value;
    else calendarAssignments[entry.key]=value;
  }
  function autoEntrySlot(entry){
    return entry.kind==='line'
      ?rowsHost.querySelector('[data-line-id="'+entry.lineId+'"][data-zone="'+entry.zone+'"]')
      :document.querySelector('[data-calendar-key="'+entry.key+'"]');

  function renderAutoAssemblyReport(mode,summary,issues,notes){
    clearAutoReviewReport();
    if(!autoReviewReportEl) return;
    const messages=[...issues,...(notes||[]).map(message=>({kind:'note',message}))];
    if(!messages.length) return;
    const list=document.createElement('ul');list.className='auto-review-list';
    messages.forEach(issue=>{
      const item=document.createElement('li');
      item.className=issue.kind==='error'?'error':issue.kind==='missing'?'missing':'note';
      item.textContent=issue.message;list.appendChild(item);
      const slot=issue.entry?autoEntrySlot(issue.entry):null;
      if(slot&&issue.kind==='error') slot.classList.add('auto-check-error');
      if(slot&&issue.kind==='missing') slot.classList.add('auto-check-missing');
    });
    autoReviewReportEl.appendChild(list);
    autoReviewReportEl.hidden=false;
  }
  function runAutoAssembly(mode){
    const plan=buildAutoAssemblyPlan();
    if(!plan.ready){
      renderAutoAssemblyReport(mode,'',[],plan.notes.slice(0,1));
      showToast('请先完成摇卦或核对卦盘条件');
      return;
    }
    // Preserve the original values so automatically inserted values are not
    // presented as if the user had already entered and passed them.
    const originalValues=new Map(plan.entries.map(entry=>[entry,readAutoEntry(entry)]));
    if(mode==='fill'){
      plan.entries.forEach(entry=>{
        if(!originalValues.get(entry)){
          writeAutoEntry(entry,entry.expected);
        }
      });
      for(let i=0;i<6;i++) renderRow(i);
      renderCalendarDropSlots();
      renderLineIndicators();
    }
    const errors=[],missing=[];
    for(const entry of plan.entries){
      const current=readAutoEntry(entry);
      if(mode==='fill'&&!originalValues.get(entry)) continue;
      if(!current) missing.push({kind:'missing',entry,message:entry.label+'：尚未填写，应该为「'+entry.expected+'」。'});
      else if(current!==entry.expected) errors.push({kind:'error',entry,message:entry.label+'：你填写的是「'+current+'」，正确应为「'+entry.expected+'」。已保留原值。'});
    }
    const issues=[...errors,...missing];
    renderAutoAssemblyReport(mode,'',issues,[]);
    if(mode==='fill') showToast(errors.length?'有项目需要核对':'装卦完成');
    else showToast(issues.length?'发现需要核对的项目':'未发现错误');
  }

  async function githubRequest(path, options={}){
    const response=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
    const payload=await response.json().catch(()=>({}));
    if(!response.ok){const error=new Error(payload.error||('GitHub API error '+response.status));error.status=response.status;throw error;}
    return payload;
  }

  async function loadDayFromGitHub(date, options={}){

    setGitHubStatus('正在读取 '+date+' …');
    try{
      const result=await githubRequest('/records/'+date,{method:'GET'});
      let doc=result.record||null;
      githubShaByDate.set(date,result.sha||null);
      if(!doc){
        const legacy=readRecords().filter(item=>item.date===date);
        const daily=legacy.find(item=>item.recordType==='dailyFortune'||(!item.isCase&&(item.question?.category||'daily')==='daily'))||null;
        const extras=legacy.filter(item=>item!==daily);
        if(daily||extras.length){
          doc={schemaVersion:1,recordDate:date,timezone:JAPAN_TZ,dailyFortune:daily?{...daily,recordType:'dailyFortune'}:null,additionalQuestions:extras.map(item=>({...item,recordType:'additionalQuestion'})),dailyMemo:daily?.dailyMemo||legacy.find(item=>item.dailyMemo)?.dailyMemo||'',createdAt:null,updatedAt:null};
          setGitHubStatus('发现浏览器旧记录；保存后可迁移到 GitHub');
        }
      }
      activeDayDocument=doc||{schemaVersion:1,recordDate:date,timezone:JAPAN_TZ,dailyFortune:null,additionalQuestions:[],dailyMemo:'',createdAt:null,updatedAt:null};
      replaceDayCache(date,activeDayDocument);

      else setGitHubStatus('读取失败：'+error.message);

  async function loadAllRecordsFromGitHub(){
    const ok=githubAuthenticated||await refreshGitHubAuth();
    if(!ok){
      setGitHubStatus('请先连接 GitHub，才能同步云端卦例');
      return false;
    }
    setGitHubStatus('正在从 GitHub 读取全部卦例 …');
    const result=await githubRequest('/records',{method:'GET'});
    const remote=Array.isArray(result.records)?result.records:[];
    const existing=readRecords();
    const merged=[];
    const seen=new Set();
    // Prefer GitHub copies, but keep browser-only legacy records that have not been migrated.
    for(const record of [...remote,...existing]){
      const key=record&&record.id
        ?String(record.date||'')+':'+String(record.id)
        :String(record?.date||'')+':'+String(record?.savedAt||'')+':'+recordThrowText(record||{});
      if(seen.has(key)) continue;
      seen.add(key);
      merged.push(record);
    }
    if(!writeRecords(merged)) throw new Error('无法更新浏览器记录列表；GitHub 中的原始文件没有被修改');
    renderRecords();
    const skipped=Number(result.skippedFiles||0);
    setGitHubStatus('已从 GitHub 同步 '+remote.length+' 条卦例'+(skipped?'；有 '+skipped+' 个文件未能读取':''));
    return true;
  }

  async function saveDayToGitHub(date, documentData){
    if(!githubAuthenticated&&!await refreshGitHubAuth()) throw new Error('请先连接 GitHub');
    if(!githubShaByDate.has(date)) await loadDayFromGitHub(date);
    const sha=githubShaByDate.get(date)||null;
    setGitHubStatus('正在保存到 GitHub …');
    const result=await githubRequest('/records/'+date,{method:'PUT',body:JSON.stringify({record:documentData,sha})});
    githubShaByDate.set(date,result.sha||null);activeDayDocument=documentData;
    setGitHubStatus('已保存到 GitHub：'+date);
    return result;
  }

      savedAt:new Date().toISOString(),date:document.getElementById('record-date').value||selectedDateKey,timezone:JAPAN_TZ,
      question:getQuestionSnapshot(),isCase:isCaseRecord,
      ...(isCaseRecord?{caseSource:caseSourceSelect.value,caseMemo:memoTextarea.value.trim(),caseConclusion:caseConclusionTextarea.value.trim()}:{}),
      dailyMemo:isCaseRecord?'':memoTextarea.value.trim(),
      pillars:{year:currentPillars.year||'',month:currentPillars.month||'',day:currentPillars.day||''},
      pillarSource:isCaseRecord&&manualPillarOverride.enabled?'manual-case':'calendar-date',
      pillarOverride:isCaseRecord&&manualPillarOverride.enabled?{
        enabled:true,
        year:{...manualPillarOverride.year},
        month:{...manualPillarOverride.month},
        day:{...manualPillarOverride.day}
      }:null,
      // Keep user input separate from calculated analysis, so records can be independently re-evaluated.
      lines:state.map(item=>{
        const isMoving=!!getLineMovementInfo(item);
        return {flowers:item.flowers,branch:item.branch,relation:item.relation,hiddenRelation:item.hiddenRelation||null,shen:item.shen,
          changeBranch:isMoving?item.changeBranch:null,changeRelation:isMoving?item.changeRelation:null,
          effect:isMoving?(item.effect||''):''};
      }),
      calendarAssignments:{...calendarAssignments,xunkong1:currentXunkongBranches[0]||null,xunkong2:currentXunkongBranches[1]||null},
      jianchu:!(isCaseRecord&&manualPillarOverride.enabled)&&currentJianChuInfo?{...currentJianChuInfo,yi:currentJianChuInfo.yi||'',ji:currentJianChuInfo.ji||'',guidanceSnapshot:currentJianChuInfo.guidance||'',savedAt:new Date().toISOString()}:null,
      twentyEight:!(isCaseRecord&&manualPillarOverride.enabled)&&currentTwentyEightInfo?{...currentTwentyEightInfo,candidateYiji:{...currentTwentyEightInfo.candidateYiji}}:null
    };
    record.analysisSnapshot=buildRecordAnalysisSnapshot(record);
    return record;
  }
  function editableEntryFingerprint(){

      date:record.date,
      question:record.question,
      isCase:record.isCase,
      caseSource:record.isCase?record.caseSource:null,
      caseReviewStatus:record.isCase?record.caseReviewStatus:null,
      pillarSource:record.pillarSource,
      pillarOverride:record.pillarOverride,

  function recordHexagramName(record){
    if(!record||!Array.isArray(record.lines)||record.lines.length!==6||record.lines.some(line=>line.flowers===null||line.flowers===undefined)) return '未完成六爻';
    const pattern=record.lines.map(line=>mapping[line.flowers]?.yang?'1':'0').join('');

  async function getDayDocumentForSave(date){

    const result=await githubRequest('/records/'+date,{method:'GET'});

  async function saveCurrentRecord(){
    const pillarProblem=manualPillarProblem();
    if(pillarProblem){showToast(pillarProblem);return false;}
    const record=makeRecordSnapshot();
    const date=record.date;
    let doc;
    try{doc=await getDayDocumentForSave(date);}
    catch(error){setGitHubStatus('未同步：'+error.message);showToast('GitHub 读取失败，未保存：'+error.message);return false;}
    const now=new Date().toISOString();
    doc.schemaVersion=1;doc.recordDate=date;doc.timezone=JAPAN_TZ;
    doc.createdAt=doc.createdAt||now;doc.updatedAt=now;
    if(!record.isCase) doc.dailyMemo=memoTextarea.value.trim();
    const category=record.question?.category||'daily';
    const list=Array.isArray(doc.additionalQuestions)?doc.additionalQuestions:[];
    const existingAdditionalIndex=list.findIndex(item=>item.id===record.id);
    const existingAdditional=existingAdditionalIndex>=0?list[existingAdditionalIndex]:null;
    const existingDaily=doc.dailyFortune?.id===record.id?doc.dailyFortune:null;
    const shouldSaveAsDaily=!record.isCase&&category==='daily'&&(
      !!existingDaily||(!editingRecordId&&!doc.dailyFortune&&!existingAdditional)
    );
    if(shouldSaveAsDaily){
      if(!existingDaily){
        const defaultDailyId='daily-'+date;
        record.id=list.some(item=>item.id===defaultDailyId)?'daily-'+date+'-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now())):defaultDailyId;
        record.createdAt=now;
      }
      else record.createdAt=existingDaily.createdAt||existingDaily.savedAt||now;
      record.updatedAt=now;record.savedAt=now;record.recordType='dailyFortune';
      delete record.dailyMemo;delete record.caseSource;delete record.caseReviewStatus;delete record.caseMemo;
      doc.dailyFortune=record;doc.additionalQuestions=list;
      doc.dailyMemo=memoTextarea.value.trim();
    }else{
      if(existingDaily) doc.dailyFortune=null;
      if(existingAdditional){
        record.createdAt=existingAdditional.createdAt||existingAdditional.savedAt||now;
        record.updatedAt=now;list[existingAdditionalIndex]=record;
      }else{
        // New entries and imported records never take over another record's daily slot.
        if(!record.id) record.id='question-'+(crypto.randomUUID?crypto.randomUUID():String(Date.now()));
        record.createdAt=now;record.updatedAt=now;list.unshift(record);
      }
      record.savedAt=now;record.recordType='additionalQuestion';delete record.dailyMemo;
      doc.additionalQuestions=list;
    }
    try{
      await saveDayToGitHub(date,doc);
      editingRecordId=record.id;forceNewRecord=false;
      replaceDayCache(date,doc);
      let markdownError=null;
      const markdownRecord={
        ...record,
        date,
        recordType:shouldSaveAsDaily?'dailyFortune':'additionalQuestion',
        ...(shouldSaveAsDaily?{dailyMemo:doc.dailyMemo||''}:{})
      };
      try{await saveRecordMarkdown(markdownRecord);}
      catch(error){markdownError=error;}
      markEntryClean();
      const savedLabel=record.isCase?(record.caseSource==='practice'?'个人练习案例已保存：':'课堂案例已保存：'):(shouldSaveAsDaily?'每日卦已保存：':(category==='daily'?'新卦例已另存：':'额外问题已保存：'));
      if(markdownError){
        setGitHubStatus('JSON 已保存；MD 未同步：'+markdownError.message);
        showToast(savedLabel+recordHexagramName(record)+'；MD 保存失败');
      }else{
        setGitHubStatus('JSON 与 MD 已保存：'+date);
        showToast(savedLabel+recordHexagramName(record)+'；MD 已保存');
      }
      return true;
    }catch(error){setGitHubStatus('未同步：'+error.message);showToast('GitHub 保存失败，尚未同步：'+error.message);return false;}
  }
  function openRecord(record){

      dayRelation:relations.includes(record.calendarAssignments?.dayRelation)?record.calendarAssignments.dayRelation:null,
      dayGod:sixGods.includes(record.calendarAssignments?.dayGod)?record.calendarAssignments.dayGod:null,
      xunkong1:currentXunkongBranches[0]||null,
